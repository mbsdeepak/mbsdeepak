<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="'SFMono-Regular', ui-monospace, 'Menlo', 'Consolas', monospace">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="0.55" stop-color="#39c5cf"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#39c5cf"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </linearGradient>
  </defs>

  <!-- window -->
  <rect x="8" y="8" width="844" height="384" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M8 22 a14 14 0 0 1 14 -14 h816 a14 14 0 0 1 14 14 v26 h-844 z" fill="#161b22"/>
  <line x1="8" y1="48" x2="852" y2="48" stroke="#30363d" stroke-width="1"/>
  <circle cx="34" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="56" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="78" cy="28" r="6" fill="#27c93f"/>
  <text x="430" y="33" text-anchor="middle" fill="#6e7681" font-size="14">mbsdeepak — ~/agent-infra</text>

  <!-- body -->
  <text x="36" y="102" font-size="17" fill="#3fb950">$ <tspan fill="#e6edf3">whoami</tspan></text>
  <text x="36" y="144" font-size="26" font-weight="700" fill="url(#name)">Bhargava Sai Deepak Mathukumalli</text>
  <rect x="36" y="154" width="472" height="3" rx="1.5" fill="url(#bar)"/>
  <text x="36" y="182" font-size="15" fill="#6e7681"># Software Engineer II · Bengaluru, India</text>

  <text x="36" y="234" font-size="17" fill="#3fb950">$ <tspan fill="#e6edf3">cat focus.md</tspan></text>
  <text x="36" y="272" font-size="18" fill="#a5d6ff">Building LLM-agent infrastructure from first principles.</text>
  <text x="36" y="302" font-size="14" fill="#c9d1d9">runtime · context · gateway · evals · tracing<tspan fill="#6e7681"> — all in readable Python.</tspan></text>

  <text x="36" y="352" font-size="17" fill="#3fb950">$ </text>
  <rect x="55" y="338" width="11" height="19" fill="#39c5cf">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
